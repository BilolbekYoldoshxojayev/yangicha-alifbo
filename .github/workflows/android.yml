# Android build: the Kotlin port of the engine (android/engine) and the keyboard app (android/app).
# Every push checks that the Kotlin engine converts exactly like the C# engine used on Windows,
# then builds the APK.
#
# Release: push a tag `android-v<versionName>` (e.g. android-v1.0.0, matching `appVersion` in
# android/app/build.gradle.kts). The workflow builds the APK and creates the GitHub release with
#   yangialifbo-android.apk  and  yangialifbo-android.apk.sha256
# attached (or uploads them to the release if it already exists). The same can be started by hand:
# Actions > Android > Run workflow, with the tag name filled in.
#
# Release signing (optional, otherwise the APK is signed with a throwaway debug key and a
# phone will refuse to update it from a build signed with another key). Repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks      (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD  ANDROID_KEY_ALIAS  ANDROID_KEY_PASSWORD
name: Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", "src/YangiAlifbo.Core/**", "tools/parity/**", "tests/data/parity.sha256", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Create or update the release with this tag (e.g. android-v1.0.0). Empty: build only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The tag to publish: the pushed tag, or the one typed into "Run workflow".
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the app version
        if: env.RELEASE_TAG != ''
        run: |
          name=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          test -n "$name"
          if [ "android-v$name" != "$RELEASE_TAG" ]; then
            echo "::error::tag $RELEASE_TAG does not match appVersion $name in android/app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - name: Parity with Windows (C# engine)
        run: |
          out=$(dotnet run -c Release --project tools/parity -- words.txt managed.tsv)
          echo "$out"
          got=$(echo "$out" | sed -n 's/.*sha256 //p')
          test "$got" = "$(cut -d' ' -f1 tests/data/parity.sha256)"

      - name: Parity with Windows (Kotlin engine)
        working-directory: android
        run: |
          out=$(./gradlew -q :engine:parity -Pwords="$GITHUB_WORKSPACE/words.txt" -Pout="$GITHUB_WORKSPACE/kotlin.tsv")
          echo "$out"
          got=$(echo "$out" | sed -n 's/.*sha256 //p')
          test "$got" = "$(cut -d' ' -f1 ../tests/data/parity.sha256)" || { diff "$GITHUB_WORKSPACE/managed.tsv" "$GITHUB_WORKSPACE/kotlin.tsv" | head -20; exit 1; }

      - name: Unit tests
        working-directory: android
        run: ./gradlew :engine:test :app:testDebugUnitTest

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key"
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/yangialifbo-android.apk
          (cd dist && sha256sum yangialifbo-android.apk > yangialifbo-android.apk.sha256)
          ls -l dist
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs dist/yangialifbo-android.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: yangialifbo-android
          path: dist/*

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "YangiAlifbo Android ${RELEASE_TAG#android-v}" \
              --notes "Android ${RELEASE_TAG#android-v}: \`yangialifbo-android.apk\` ni o‘rnating, ilovada «Yoqish» tugmasini bosing. SHA-256: \`yangialifbo-android.apk.sha256\`."
          fi
