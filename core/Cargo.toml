[package]
name = "yangi-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust core for YangiAlifbo: phonetic transliteration, language discrimination, chat normalization, and text conversion"

[dependencies]
fst = "0.4"
byteorder = "1.5"
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]
embedded-data = []
